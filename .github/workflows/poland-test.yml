
name: Poland IMGW API Test

on:
  workflow_dispatch:

jobs:
  poland-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Poland IMGW API
        run: python poland_probe.py
