name: Luxembourg LU-Alert

on:
  workflow_dispatch:

  schedule:
    - cron: "7,22,37,52 * * * *"

jobs:
  luxembourg-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect Luxembourg LU-Alert
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python luxembourg.py
