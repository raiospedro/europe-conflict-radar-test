name: Luxembourg LU-Alert Test

on:
  workflow_dispatch:

jobs:
  luxembourg-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Luxembourg LU-Alert
        run: python luxembourg.py
