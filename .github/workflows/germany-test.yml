name: Germany Official Alerts Test

on:
  workflow_dispatch:

jobs:
  germany-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Germany NINA alerts
        run: python germany.py
