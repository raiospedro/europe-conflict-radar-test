name: Lithuania Official Alerts Test

on:
  workflow_dispatch:

jobs:
  lithuania-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Lithuania official data
        run: python lithuania.py
